name: CI-CD pipeline

on:
  push:
    branches: [main, dev]

jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: "20"
  # The explicit build job was removed per request; Vercel will build on deploy.
  # Deploy job now receives the correct Supabase env vars for prod vs dev.
  deploy:
    name: Deploy to Vercel
    needs: tests
    runs-on: ubuntu-latest

    env:
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    defaults:
      run:
        working-directory: StartBrewing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Choose Supabase env for deploy
        run: |
          if [ "${IS_PROD}" = "true" ]; then
            echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
            echo "SUPABASE_VAR_PREFIX=NEXT_PUBLIC" >> $GITHUB_ENV
            echo "Using PROD Supabase variables (secrets hidden)"
          else
            echo "SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
            echo "SUPABASE_VAR_PREFIX=EXPO_PUBLIC" >> $GITHUB_ENV
            echo "Using DEV (EXPO) Supabase variables (secrets hidden)"
          fi

      # Explicitly link to the correct Vercel project
      - name: Link Vercel project
        run: vercel link --project start-to-brew --yes --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          # Build the env flags for Vercel so the correct variable names are set for prod vs dev
          VAR_PREFIX="$SUPABASE_VAR_PREFIX"
          URL_VAR_NAME="${VAR_PREFIX}_SUPABASE_URL"
          KEY_VAR_NAME="${VAR_PREFIX}_SUPABASE_ANON_KEY"

          # Compose --env flags
          ENV_FLAGS=(--env "$URL_VAR_NAME=$SUPABASE_URL" --env "$KEY_VAR_NAME=$SUPABASE_ANON_KEY")

          # Add --prod for main branch
          if [ "$IS_PROD" = "true" ]; then
            PROD_FLAG=(--prod)
          else
            PROD_FLAG=()
          fi

          # Run vercel deploy in the StartBrewing directory (defaults.run) so Vercel uses that project root
          set -o pipefail
          URL=$(vercel deploy "${PROD_FLAG[@]}" "${ENV_FLAGS[@]}" --token "$VERCEL_TOKEN" | tail -n1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed URL: $URL"

      - name: Alias
        run: |
          ALIAS=$([ "$IS_PROD" = "true" ] && echo "start-to-brew.vercel.app" || echo "start-to-brew-dev.vercel.app")
          vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "Aliased to: $ALIAS"
