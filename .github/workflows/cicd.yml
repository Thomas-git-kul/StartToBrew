name: CI-CD pipeline

on:
  push:
    branches: [main, dev]

jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: "20"

  build:
    name: Build Expo Web App
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_EMAILJS_SERVICE_ID }}
      EXPO_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EXPO_PUBLIC_EMAILJS_TEMPLATE_ID }}
      EXPO_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_EMAILJS_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: StartBrewing

    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: StartBrewing/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm install

      - name: Choose Supabase env for build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          else
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          fi

      - name: Test show received environment variables
        run: |
          echo "IS_PROD=${IS_PROD}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "VERCEL_TOKEN set: $([ -n \"$VERCEL_TOKEN\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_ORG_ID set: $([ -n \"$VERCEL_ORG_ID\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_PROJECT_ID set: $([ -n \"$VERCEL_PROJECT_ID\" ] && echo \"true\" || echo \"false\")"
          echo "NEXT_PUBLIC_SUPABASE_URL set: $([ -n \"$NEXT_PUBLIC_SUPABASE_URL\" ] && echo \"true\" || echo \"false\")"
          echo "EXPO_PUBLIC_SUPABASE_URL set: $([ -n \"$EXPO_PUBLIC_SUPABASE_URL\" ] && echo \"true\" || echo \"false\")"

          # Mask anon keys before printing so logs don't expose full keys
          mask_key() {
            k="$1"
            if [ -z "$k" ]; then
              echo "<not set>"
              return
            fi
            # print first 6 chars and last 4 chars, with ellipsis in middle
            prefix=${k:0:6}
            suffix=${k: -4}
            echo "${prefix}...${suffix}"
          }

          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$NEXT_PUBLIC_SUPABASE_ANON_KEY\")"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$EXPO_PUBLIC_SUPABASE_ANON_KEY\")"

      - name: Build web export
        run: npm run build:web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest

    env:
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: StartBrewing/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist

      # Explicitly link to the correct Vercel project
      - name: Link Vercel project
        run: vercel link --project start-to-brew --yes --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          # Compose --env flags using a simple if/else for prod vs dev
          if [ "${IS_PROD}" = "true" ]; then
            ENV_FLAGS=(--env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" --env "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY")
            PROD_FLAG=(--prod)
          else
            ENV_FLAGS=(--env "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" --env "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY")
            PROD_FLAG=()
          fi

          set -o pipefail
          # Deploy the previously-built web export (StartBrewing/dist)
          URL=$(vercel deploy dist \
            $([ "$IS_PROD" = "true" ] && echo "--prod") \
            --token "$VERCEL_TOKEN")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed URL: $URL"

      - name: Alias
        run: |
          ALIAS=$([ "$IS_PROD" = "true" ] && echo "start-to-brew.vercel.app" || echo "start-to-brew-dev.vercel.app")
          vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "Aliased to: $ALIAS"

      - name: Test show received environment variables
        run: |
          echo "IS_PROD=${IS_PROD}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "VERCEL_TOKEN set: $([ -n \"$VERCEL_TOKEN\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_ORG_ID set: $([ -n \"$VERCEL_ORG_ID\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_PROJECT_ID set: $([ -n \"$VERCEL_PROJECT_ID\" ] && echo \"true\" || echo \"false\")"
          echo "NEXT_PUBLIC_SUPABASE_URL set: $([ -n \"$NEXT_PUBLIC_SUPABASE_URL\" ] && echo \"true\" || echo \"false\")"
          echo "EXPO_PUBLIC_SUPABASE_URL set: $([ -n \"$EXPO_PUBLIC_SUPABASE_URL\" ] && echo \"true\" || echo \"false\")"

          # Mask anon keys before printing so logs don't expose full keys
          mask_key() {
            k="$1"
            if [ -z "$k" ]; then
              echo "<not set>"
              return
            fi
            # print first 6 chars and last 4 chars, with ellipsis in middle
            prefix=${k:0:6}
            suffix=${k: -4}
            echo "${prefix}...${suffix}"
          }
            

          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$NEXT_PUBLIC_SUPABASE_ANON_KEY\")"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$EXPO_PUBLIC_SUPABASE_ANON_KEY\")"
