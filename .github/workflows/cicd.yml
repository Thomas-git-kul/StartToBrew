name: CI-CD pipeline

on:
  push:
    branches: [main, dev]


jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: '20'

  build:
    name: Build Expo Web App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StartBrewing

    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: StartBrewing/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm install

      - name: Build web export
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist

  deploy-development:
    name: Deploy to Vercel (Development)
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Explicitly link to the correct Vercel project
      - name: Link Vercel project
        run: vercel link --project start-to-brew --yes --token "$VERCEL_TOKEN"

      # Deploy directly from StartBrewing/dist
      - name: Deploy folder to Vercel (no build on Vercel)
        run: |
          cd StartBrewing/dist
          vercel deploy --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes
