name: CI-CD pipeline

on:
  push:
    branches: [main, dev]

jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: "20"
  # The explicit build job was removed per request; Vercel will build on deploy.
  # Deploy job now receives the correct Supabase env vars for prod vs dev.
  deploy:
    name: Deploy to Vercel
    needs: tests
    runs-on: ubuntu-latest

    env:
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # Run Vercel commands explicitly from the StartBrewing directory to avoid
    # incorrect path concatenation by the Vercel CLI.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: StartBrewing/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Choose Supabase env for deploy
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY || true
          if [ "${IS_PROD}" = "true" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          else
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          fi

      - name: Test show received environment variables
        run: |
          echo "IS_PROD=${IS_PROD}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "VERCEL_TOKEN set: $([ -n \"$VERCEL_TOKEN\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_ORG_ID set: $([ -n \"$VERCEL_ORG_ID\" ] && echo \"true\" || echo \"false\")"
          echo "VERCEL_PROJECT_ID set: $([ -n \"$VERCEL_PROJECT_ID\" ] && echo \"true\" || echo \"false\")"
          # Show which Supabase URL variables are present (prints actual URLs)
          echo "NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-<not set>}"
          echo "EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-<not set>}"

          # Mask anon keys before printing so logs don't expose full keys
          mask_key() {
            k="$1"
            if [ -z "$k" ]; then
              echo "<not set>"
              return
            fi
            # print first 6 chars and last 4 chars, with ellipsis in middle
            prefix=${k:0:6}
            suffix=${k: -4}
            echo "${prefix}...${suffix}"
          }

          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$NEXT_PUBLIC_SUPABASE_ANON_KEY\")"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY (masked): $(mask_key \"$EXPO_PUBLIC_SUPABASE_ANON_KEY\")"

      - name: Install dependencies and build
        run: |
          set -e
          # Build web assets for Vercel; use the web-specific build script
          npm run build:web

      # Explicitly link to the correct Vercel project
      - name: Link Vercel project
        run: |
          # Run link from repo root but use the StartBrewing vercel.json so the
          # CLI doesn't double-append the project root.
          vercel link --local-config StartBrewing/vercel.json --project start-to-brew --yes --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          # Compose --env flags using a simple if/else for prod vs dev
          if [ "${IS_PROD}" = "true" ]; then
            ENV_FLAGS=(--env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" --env "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY")
            PROD_FLAG=(--prod)
          else
            ENV_FLAGS=(--env "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" --env "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY")
            PROD_FLAG=()
          fi

          set -o pipefail
          # Deploy from repo root but use the StartBrewing vercel.json config
          URL=$(vercel deploy "${PROD_FLAG[@]}" "${ENV_FLAGS[@]}" --local-config StartBrewing/vercel.json --token "$VERCEL_TOKEN" | tail -n1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed URL: $URL"

      - name: Alias
        run: |
          ALIAS=$([ "$IS_PROD" = "true" ] && echo "start-to-brew.vercel.app" || echo "start-to-brew-dev.vercel.app")
          vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "Aliased to: $ALIAS"
