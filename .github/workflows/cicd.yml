name: CI-CD pipeline

on:
  push:
    branches: [main, dev]

jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: "20"

  deploy:
    name: Deploy to Vercel
    needs: tests
    runs-on: ubuntu-latest

    env:
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    defaults:
      run:
        working-directory: StartBrewing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log deployment configuration
        run: |
          echo "=========================================="
          echo "DEPLOY JOB - Configuration Check"
          echo "=========================================="
          echo "Deploying from branch: ${{ github.ref }}"
          echo "Is production deployment: $IS_PROD"
          echo ""
           if [ "$IS_PROD" = "true" ]; then
            echo "✓ Using NEXT_PUBLIC Supabase credentials (production)"
            echo "  Supabase URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "  Anon Key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          else
            echo "✓ Using EXPO_PUBLIC Supabase credentials (development)"
            echo "  Supabase URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "  Anon Key: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
          fi
          echo "=========================================="

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=$([ "$IS_PROD" = "true" ] && echo "production" || echo "preview") --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          echo "Starting Vercel deployment..."
          echo "Vercel will build the project with the environment-specific variables..."

          URL=$(vercel deploy \
            $([ "$IS_PROD" = "true" ] && echo "--prod") \
            --token "$VERCEL_TOKEN" \
            --yes)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✓ Deployed URL: $URL"

      - name: Set Alias
        run: |
          ALIAS=$([ "$IS_PROD" = "true" ] && echo "start-to-brew.vercel.app" || echo "start-to-brew-dev.vercel.app")
          vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "✓ Aliased to: $ALIAS"

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Environment: $([ "$IS_PROD" = "true" ] && echo "Production" || echo "Preview")"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "Alias: $([ "$IS_PROD" = "true" ] && echo "start-to-brew.vercel.app" || echo "start-to-brew-dev.vercel.app")"
          echo "Database: $([ "$IS_PROD" = "true" ] && echo "Production (NEXT_PUBLIC_*)" || echo "Development (EXPO_PUBLIC_*)")"
          echo "=========================================="
