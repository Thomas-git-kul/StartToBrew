name: dev pull requests

on:
  pull_request:
    branches: [dev]

jobs:
  tests:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: '20'

  check-actor:
    name: check who is author
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      is_author: ${{ steps.setflag.outputs.is_author }}
    steps:
      - name: Check who is the author
        id: setflag
        run: |
          if [ "${{ github.actor }}" == "Thomas-git-kul" ]; then
            echo "is_author=true" >> $GITHUB_OUTPUT
          else
            echo "is_author=false" >> $GITHUB_OUTPUT
          fi

  debug:
    needs: check-actor
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actor = ${{ github.actor }}, Is Author = ${{ needs.check-actor.outputs.is_author }}"

  notify-Thomas:
    name: Notify Thomas to pull
    needs: check-actor
    if: needs.check-actor.outputs.is_author == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Notify via GitHub Issue
        uses: peter-evans/create-issue@v5
        with:
          title: "🚨 Unauthorized PR to dev by ${{ github.actor }}"
          body: |
            ⚠️ **Unauthorized PR detected**

            - **User:** ${{ github.actor }}
            - **Branch:** ${{ github.head_ref }}
            - **PR Title:** ${{ github.event.pull_request.title }}
            - **Link:** ${{ github.event.pull_request.html_url }}

            Please review and merge manually if appropriate.
          labels: notification
          assignees: Thomas-git-kul
