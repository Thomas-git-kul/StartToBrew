name: CI pipeline

on:
  push:
    branches: [main, dev]

jobs:
  setup:
    name: Setup & Cache dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StartBrewing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

  # lint and security
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StartBrewing
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run lint
        run: npm run lint

  security:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StartBrewing
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (moderate+)
        run: npm audit --audit-level=moderate || true

  build:
    name: Build Expo Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StartBrewing
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build web export
        run: npm run build:web
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist
          # retention-days: 7  # optional

  deploy-development:
    name: Deploy to Vercel (Development)
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StartBrewing
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: StartBrewing/dist

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link env (preview)
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Deploy folder to Vercel (no build on Vercel)
        run: vercel deploy StartBrewing/dist --token "$VERCEL_TOKEN" --confirm
